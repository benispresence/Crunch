name: Desktop Mac zips

# Builds a downloadable Crunch.app zip per Mac architecture.
#   macos-14 → Apple Silicon (arm64)
#   macos-15-intel → Intel (x64)
#
# Artifacts are named Crunch-<version>-mac-<arch>.zip.
# On a version tag they are also attached to the GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            label: apple-silicon
          - os: macos-15-intel
            arch: x64
            label: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: ${{ matrix.arch }}

      - name: Install JS deps
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix desktop

      - name: Pack Mac zip (${{ matrix.label }})
        run: npm run pack:mac -- --arch=${{ matrix.arch }}
        working-directory: desktop

      - name: Test production desktop setup
        run: node --test backend/test/desktopSetup.test.mjs

      - name: Verify the distributed zip
        env:
          MAC_ARCH: ${{ matrix.arch }}
        run: |
          ditto -x -k "desktop/release/Crunch-$(node -p "require('./desktop/package.json').version")-mac-${MAC_ARCH}.zip" "$RUNNER_TEMP/crunch-unpacked"
          node desktop/scripts/verify-mac.mjs "$RUNNER_TEMP/crunch-unpacked/Crunch.app" "$MAC_ARCH"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Crunch-mac-${{ matrix.label }}
          path: desktop/release/Crunch-*-mac-*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/Crunch-*-mac-*.zip
